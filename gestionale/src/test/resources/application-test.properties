# =====================================================================
# CONFIGURAZIONE USATA SOLO DAI TEST (profilo "test")
#
# Sostituisce il MariaDB locale con H2, un database in-memory:
# - nasce vuoto all'avvio del test
# - sparisce alla fine (create-drop)
# - non richiede nulla di installato sulla macchina
# La configurazione di produzione (application.properties) NON viene toccata.
# =====================================================================

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:gestionale_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Dialetto H2 (in produzione c'e' MySQLDialect)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Le tabelle vengono create all'avvio del test e distrutte alla fine:
# ogni esecuzione parte da un database pulito e riproducibile
spring.jpa.hibernate.ddl-auto=create-drop

# Niente SQL in console: nei test il rumore nasconde i fallimenti veri
spring.jpa.show-sql=false
